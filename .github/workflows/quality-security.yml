
name: Quality and Security Analysis

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript validation
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: ESLint validation
        run: npm run lint

      - name: Frontend tests
        run: npm run test:notifications

      - name: Install backend dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Backend tests
        run: npm test --prefix backend

  sonarcloud:
    name: SonarCloud
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify SonarCloud token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is not configured"
            exit 1
          fi

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Hansolo2077_barberia-cale
            -Dsonar.organization=hansolo2077
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

  deepsource:
    name: DeepSource
    needs: sonarcloud
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      # Official API: https://docs.deepsource.com/docs/developers/api/analysis-run
      # Use the PR head SHA, not GitHub's synthetic merge commit.
      - name: Wait for DeepSource analysis of this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEEPSOURCE_PAT: ${{ secrets.DEEPSOURCE_PAT }}
          ANALYSIS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const token = process.env.DEEPSOURCE_PAT;
            const sha = process.env.ANALYSIS_SHA;
            if (!token) {
              core.setFailed('Configure the DEEPSOURCE_PAT repository secret with a DeepSource Personal Access Token.');
              return;
            }

            const query = `query ($sha: String!) {
              run(commitOid: $sha) {
                commitOid
                status
                finishedAt
                repository { name vcsUrl }
              }
            }`;
            const repositoryUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const normalizeUrl = (url) => url.replace(/\/$/, '').replace(/\.git$/, '').toLowerCase();

            for (let attempt = 1; attempt <= 30; attempt++) {
              const response = await fetch('https://api.deepsource.com/graphql/', {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ query, variables: { sha } }),
                signal: AbortSignal.timeout(30000),
              });
              if (!response.ok) {
                core.setFailed(`DeepSource API returned HTTP ${response.status}. Check token access and API availability.`);
                return;
              }
              const result = await response.json();
              if (result.errors?.length || !result.data || !Object.hasOwn(result.data, 'run')) {
                core.setFailed('DeepSource GraphQL query failed. Check PAT permissions and the official API schema.');
                return;
              }
              const run = result.data.run;
              if (run) {
                if (run.commitOid !== sha || normalizeUrl(run.repository.vcsUrl) !== repositoryUrl) {
                  core.setFailed('DeepSource returned an analysis for a different commit or repository.');
                  return;
                }
                core.info(`DeepSource ${sha}: ${run.status} (attempt ${attempt}/30)`);
                if (run.status === 'SUCCESS' && run.finishedAt) {
                  core.info(`DeepSource analysis completed successfully at ${run.finishedAt}.`);
                  return;
                }
                if (!['PENDING', 'READY', 'SUCCESS'].includes(run.status)) {
                  core.setFailed(`DeepSource analysis did not pass: ${run.status}. Review the DeepSource analysis for ${sha}.`);
                  return;
                }
              } else {
                core.info(`Waiting for DeepSource to register ${sha} (attempt ${attempt}/30).`);
              }
              if (attempt < 30) await new Promise(resolve => setTimeout(resolve, 20000));
            }
            core.setFailed(`Timed out waiting for a successful DeepSource analysis of ${sha}.`);

  snyk:
    name: Snyk
    needs: deepsource
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Verify Snyk token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is not configured"
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Install Snyk CLI
        # Official standalone release; no npm lifecycle scripts or floating dependencies.
        # https://downloads.snyk.io/cli/v1.1308.1/release.json
        run: |
          mkdir -p "$RUNNER_TEMP/snyk-cli"
          curl --fail --silent --show-error --location --retry 3 \
            https://downloads.snyk.io/cli/v1.1308.1/snyk-linux \
            --output "$RUNNER_TEMP/snyk-cli/snyk"
          printf '%s  %s\n' \
            'a8b2e420af6d8e61bf1d367c064475ccf699d767fc8763efb0072b9cac250f9a' \
            "$RUNNER_TEMP/snyk-cli/snyk" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/snyk-cli/snyk"
          test "$("$RUNNER_TEMP/snyk-cli/snyk" --version)" = '1.1308.1'
          echo "$RUNNER_TEMP/snyk-cli" >> "$GITHUB_PATH"

      - name: Scan frontend dependencies
        id: snyk_frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=package.json \
            --severity-threshold=high

      - name: Scan backend dependencies
        # Preserve frontend failure while still collecting backend findings.
        if: ${{ !cancelled() && (success() || steps.snyk_frontend.outcome == 'failure') }}
        working-directory: backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=package.json \
            --severity-threshold=high
